[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kodostars"
version = "1.4.0"
description = "KodoStars — Telegram Stars referral bot with OP monetization and a full in-Telegram admin panel"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "KodoStars" }]
dependencies = [
  "aiogram>=3.15,<4",
  "SQLAlchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "aiohttp>=3.11",
  "structlog>=24.4",
  "fragment-api-py>=12.1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
kodostars = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PLC0415"]
ignore = [
  "E501",   # long f-strings in user-facing texts are wrapped by hand where it helps readability
  "RUF001", # Cyrillic strings are the product language
  "RUF002",
  "RUF003",
  "RUF012", # mutable class attributes are fine on aiogram StatesGroup / dataclasses here
  "B008",   # aiogram/pydantic call defaults
]

[tool.ruff.lint.per-file-ignores]
"app/op/*.py" = ["BLE001"]           # OP adapters are deliberately fail-open
"app/migrations/versions/*.py" = ["I001"]
